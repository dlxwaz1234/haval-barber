<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Gentleman's Cut</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:radial-gradient(circle at top right,#334155,#0f172a 55%,#020617);
    }
    .card{
      width:min(100%,460px);
      border-radius:28px;
      overflow:hidden;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(18px);
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      color:#fff;
    }
    .hero{
      position:relative;
      height:clamp(210px,42vw,280px);
      overflow:hidden;
    }
    .hero img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to top,rgba(2,6,23,.95),rgba(2,6,23,.1));
    }
    .brand{
      position:absolute;
      bottom:18px;
      right:18px;
      left:18px;
      z-index:2;
      text-align:center;
    }
    .brand h1{
      font-size:clamp(24px,5vw,30px);
      margin-bottom:6px;
    }
    .brand p{
      color:#cbd5e1;
      font-size:clamp(12px,2.8vw,14px);
    }
    .content{padding:20px}
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:100%;
      text-decoration:none;
      color:#fff;
      padding:14px 16px;
      border-radius:16px;
      margin-top:12px;
      font-size:clamp(14px,3vw,15px);
      font-weight:700;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.05);
      transition:.2s ease;
      text-align:center;
    }
    .btn:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.09);
    }
    .icon{font-size:18px;line-height:1}
    .footer{
      margin-top:18px;
      text-align:center;
      color:#94a3b8;
      font-size:12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="hero">
      <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1200&q=80" alt="Haval Barber" />
      <div class="brand">
        <h1>Gentleman's Cut</h1>
        <p>ستايل راقٍ — لمسة مميزة — حلاقة عصرية</p>
      </div>
    </div>

    <div class="content">
      <a class="btn" href="https://wa.me/9647502102302" target="_blank"><span class="icon">💬</span><span>Haval Barber 07502102302</span></a>
      <a class="btn" href="https://wa.me/9647503865713" target="_blank"><span class="icon">💬</span><span>Mevan Barber 07503865713</span></a>
      <a class="btn" href="https://www.instagram.com/gentlemancut2026?utm_source=qr&igsh=MTB0MnN0c2hwOGlvdg==" target="_blank"><span class="icon">📷</span><span>إنستغرام</span></a>
      <a class="btn" href="https://www.tiktok.com/@gentleman_cut?_r=1&_t=ZS-960SV8Pp7Lg" target="_blank"><span class="icon">🎵</span><span>تيك توك</span></a>
      <a class="btn" href="https://www.snapchat.com/add/gentleman_cut?share_id=OX9rGJ4jx-o&locale=ar-AE" target="_blank"><span class="icon">👻</span><span>سناب شات</span></a>
      <a class="https://maps.app.goo.gl/rcPJaMk3o9aq6T1w9">📍</span><span>الموقع</span></a>

      <div class="footer">Haval Barber © 2026</div>
    </div>
  </div>
</body>
</html>
